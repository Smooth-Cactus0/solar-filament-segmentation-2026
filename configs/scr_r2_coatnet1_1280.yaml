# Stage 2 of recipe r2 on CoAtNet-rmlp-1 at 1280 px, warm-started from
# checkpoints/scr_r2_coatnet1_1024_fold<k>.pt. The 1536 fine-tune (scr_r2_coatnet1_1536)
# OOMs on the A6000 (47 GB at batch 1, 2026-10-27): CoAtNet's dense attention at stride 16
# scales with the square of the token count, 9216 tokens at 1536 against 4096 at 1024. At
# 1280 (6400 tokens) it fits. The maps are cached at 1536 (eval.cache_size) so the member
# blends with the 1536 caches. Needs a 48 GB GPU.
base: scr_r2_coatnet1_1536.yaml
name: scr_r2_coatnet1_1280
recipe: r2
change: "recipe r2 stage 2 on coatnet1 at 1280 px (1536 OOMs on 48 GB)"
baseline: scr_r2_base_1536
size: 1280
eval:
  cache_size: 1536
