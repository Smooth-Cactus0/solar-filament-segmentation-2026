# Stage 2 of recipe r2 on CoAtNet-rmlp-1 (the r1 1536 fine-tune), warm-started from
# checkpoints/scr_r2_coatnet1_1024_fold<k>.pt. Transformer encoder: fine-tune lr 3e-5
# (about 1/3 of the screen's 1e-4, as r1's 5e-5 is to 3e-4). Needs a 48 GB GPU.
base: scr_r1_base_1536.yaml
name: scr_r2_coatnet1_1536
recipe: r2
change: "recipe r2 stage 2 on coatnet1"
baseline: scr_r2_base_1536
encoder: tu-coatnet_rmlp_1_rw2_224.sw_in12k_ft_in1k
lr: 3.0e-5
arch:
  decoder: Unet
  pass_img_size: true
